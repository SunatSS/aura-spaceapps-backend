openapi: 3.1.0
info:
  title: AURA API
  version: 0.6.0
  description: |
    Astronaut Universal Readiness Assessment — health monitoring API.
    Source of truth for the backend/frontend contract. The frontend generates
    TypeScript types from this file (`npm run gen:api` in aura-spaceapps-frontend).

    Timestamps are RFC 3339 in UTC. Statuses everywhere: unknown | nominal | caution | critical.

    Access (FR-71, FR-72): sign in with POST /auth/login; the session is an
    HTTP-only cookie. Crew members see only their own data; the commander, the
    deputy and the flight surgeon see the whole crew. Readings can only be
    logged by the crew member themself. Missing session → 401, role → 403.
servers:
  - url: /api/v1
security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness and database check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Service is degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /indicators:
    get:
      operationId: getCatalog
      security: []
      summary: Health content catalog — indicators, body systems, NASA HRP hazards and risks, environments
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }

  /missions/current:
    get:
      operationId: getCurrentMission
      security: []
      summary: Current mission with phases, current phase, environment and mission day
      responses:
        "200":
          description: The mission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentMission" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/passkeys:
    get:
      operationId: listPasskeys
      summary: The signed-in member's passkeys (FR-74)
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { $ref: "#/components/responses/Error" }

  /auth/passkeys/{id}:
    delete:
      operationId: deletePasskey
      summary: Remove one of your passkeys
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Options for navigator.credentials.create(); binary fields are base64url
      responses:
        "200":
          description: Registration options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyRegisterOptions" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Verify and store the new passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, clientDataJSON, attestationObject]
              additionalProperties: false
              properties:
                challenge: { type: string }
                clientDataJSON: { type: string, description: base64url }
                attestationObject: { type: string, description: base64url }
                label: { type: string, description: e.g. Windows Hello }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/passkeys/login/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Challenge for navigator.credentials.get() with a discoverable passkey
      security: []
      responses:
        "200":
          description: Sign-in options
          content:
            application/json:
              schema:
                type: object
                required: [challenge, rpId, timeout]
                properties:
                  challenge: { type: string }
                  rpId: { type: string }
                  timeout: { type: integer }

  /auth/passkeys/login/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Verify the assertion and start a session (sets the cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, id, clientDataJSON, authenticatorData, signature]
              additionalProperties: false
              properties:
                challenge: { type: string }
                id: { type: string, description: Credential ID, base64url }
                clientDataJSON: { type: string }
                authenticatorData: { type: string }
                signature: { type: string }
                userHandle: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This contract (Swagger UI at /api/docs/)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema: { type: string }

  /astronauts/{id}/profile:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: getProfile
      summary: Known conditions, baselines, personal ranges and weights (FR-6, FR-24)
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProfile
      summary: Set particularities — flight surgeon only; listed indicators and weights are replaced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                conditions: { type: string }
                indicators: { type: object, additionalProperties: { $ref: "#/components/schemas/PersonalIndicator" } }
                weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 5 }, description: 0 removes the personal weight }
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: getTasks
      summary: Today's tasks, overdue reminders, streak and badges (FR-40…FR-43)
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tasks" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/tasks/{code}/complete:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: completeTask
      summary: Mark a manual task (e.g. exercise) done today — own tasks only
      responses:
        "200":
          description: Tasks after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tasks" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: uncompleteTask
      summary: Undo today's mark
      responses:
        "200":
          description: Tasks after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tasks" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /demo/environment:
    post:
      operationId: switchEnvironment
      summary: Start a new mission phase in another environment now (demo, FR-4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              additionalProperties: false
              properties:
                environment: { $ref: "#/components/schemas/EnvironmentCode" }
      responses:
        "200":
          description: The mission after the switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentMission" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts:
    get:
      operationId: listAstronauts
      summary: Mission members, including the ground flight surgeon
      responses:
        "200":
          description: Crew list
          content:
            application/json:
              schema:
                type: object
                required: [astronauts]
                properties:
                  astronauts:
                    type: array
                    items: { $ref: "#/components/schemas/Astronaut" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: getAstronaut
      summary: One mission member
      responses:
        "200":
          description: The astronaut
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Astronaut" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/readiness:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: getReadiness
      summary: Readiness Score, per-system and per-indicator statuses
      responses:
        "200":
          description: The assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/guidance:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: getGuidance
      summary: Active recommendations and escalations to the flight surgeon
      responses:
        "200":
          description: Recommendations, most severe first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guidance" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/measurements:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: listMeasurements
      summary: Reading history in chronological order (for charts)
      parameters:
        - name: indicator
          in: query
          schema: { type: string }
          description: Indicator code, e.g. bp_systolic
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                type: object
                required: [measurements]
                properties:
                  measurements:
                    type: array
                    items: { $ref: "#/components/schemas/MeasurementView" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMeasurements
      summary: Record one or more readings (manual entry or check-in)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMeasurementsRequest" }
      responses:
        "201":
          description: Created readings with their statuses
          content:
            application/json:
              schema:
                type: object
                required: [measurements]
                properties:
                  measurements:
                    type: array
                    items: { $ref: "#/components/schemas/MeasurementView" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/activities:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: listActivities
      summary: Activities such as landing and spacewalks (EVA)
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Activities in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      summary: Sign in; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out; clears the session cookie
      security: []
      responses:
        "204": { description: Signed out }

  /auth/me:
    get:
      operationId: getSession
      summary: Who is signed in
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/demo-accounts:
    get:
      operationId: listDemoAccounts
      summary: Demo logins for the sign-in screen (demo mission only)
      security: []
      responses:
        "200":
          description: Accounts and their shared demo password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoAccounts" }
        "404": { $ref: "#/components/responses/Error" }

  /astronauts/{id}/report:
    parameters:
      - $ref: "#/components/parameters/AstronautId"
    get:
      operationId: getReport
      summary: Flight-surgeon report with readiness, out-of-range readings, recommendations and 7-day trends (FR-32)
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, text], default: json }
          description: text returns a plain-text attachment for the downlink
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /crew/overview:
    get:
      operationId: getCrewOverview
      summary: Whole crew at a glance, for the commander, the deputy and the flight surgeon (FR-55, FR-73)
      responses:
        "200":
          description: Every crew member with readiness, alerts and 7-day trends
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /demo/reset:
    post:
      operationId: resetDemo
      summary: Replace all data with a fresh demo mission and sign the caller in again (FR-62)
      responses:
        "200":
          description: Reset done; new session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /ingest:
    post:
      operationId: ingest
      summary: Batch of readings from onboard systems — environment sensors, dosimeters, wearables (FR-16)
      description: Authenticated with a bearer token (AURA_INGEST_TOKEN), not a session. Everything is stored with source = device.
      security: [{ ingestToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "202":
          description: Accepted counts
          content:
            application/json:
              schema:
                type: object
                required: [telemetry, measurements]
                properties:
                  telemetry: { type: integer }
                  measurements: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /vehicle:
    get:
      operationId: getVehicle
      summary: Life support per module with statuses (FR-80, FR-81)
      responses:
        "200":
          description: Every module, its parameters and who is in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Error" }

  /vehicle/telemetry:
    get:
      operationId: listTelemetry
      summary: Parameter history for charts; last 7 days by default (FR-84)
      parameters:
        - { name: module, in: query, schema: { type: string } }
        - { name: parameter, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Readings in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [telemetry]
                properties:
                  telemetry: { type: array, items: { $ref: "#/components/schemas/TelemetryView" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /supplies:
    get:
      operationId: listSupplies
      summary: Medical kit with statuses and usage forecast (FR-90, FR-91, FR-94)
      responses:
        "200":
          description: Every item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplies" }
        "401": { $ref: "#/components/responses/Error" }

  /supplies/journal:
    get:
      operationId: getSupplyJournal
      summary: Who took what, when and why — newest first, last 50 (FR-92)
      parameters:
        - { name: supplyId, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /supplies/{id}/use:
    parameters:
      - $ref: "#/components/parameters/SupplyId"
    post:
      operationId: useSupply
      summary: Take an item from the kit (crew on board only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, reason]
              additionalProperties: false
              properties:
                quantity: { type: number, exclusiveMinimum: 0 }
                reason: { type: string }
                recommendationId: { type: string, description: The recommendation that asked for it }
      responses:
        "200":
          description: The item after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /supplies/{id}/count:
    parameters:
      - $ref: "#/components/parameters/SupplyId"
    post:
      operationId: countSupply
      summary: Record an inventory count; a mismatch is kept as a discrepancy (FR-95)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: number, minimum: 0 }
      responses:
        "200":
          description: The item after the count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /supplies/{id}/dispose:
    parameters:
      - $ref: "#/components/parameters/SupplyId"
    post:
      operationId: disposeSupply
      summary: Write off an expired item (irreversible; the UI confirms first, FR-96)
      responses:
        "200":
          description: The item after disposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    ingestToken:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: aura_session
  parameters:
    AstronautId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    SupplyId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable error message }

    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [ok, error] }

    Status:
      type: string
      enum: [unknown, nominal, caution, critical]

    EnvironmentCode:
      type: string
      enum: [iss, lunar_surface, mars_transit, mars_surface]

    Role:
      type: string
      enum: [crew, commander, deputy_commander, flight_surgeon]

    # --- catalog ---------------------------------------------------------------
    Catalog:
      type: object
      required: [disclaimer, thresholdsNote, hazards, risks, environments, systems, indicators, vehicleParameters, countermeasures, schedule]
      properties:
        disclaimer: { type: string }
        thresholdsNote: { type: string, description: Ranges are illustrative — show next to thresholds }
        hazards: { type: array, items: { $ref: "#/components/schemas/Hazard" } }
        risks: { type: array, items: { $ref: "#/components/schemas/Risk" } }
        environments: { type: array, items: { $ref: "#/components/schemas/Environment" } }
        systems: { type: array, items: { $ref: "#/components/schemas/BodySystem" } }
        indicators: { type: array, items: { $ref: "#/components/schemas/Indicator" } }
        vehicleParameters: { type: array, items: { $ref: "#/components/schemas/VehicleParameter" } }
        countermeasures: { type: array, items: { $ref: "#/components/schemas/Countermeasure" } }
        schedule: { type: array, items: { $ref: "#/components/schemas/ScheduleItem" } }

    Countermeasure:
      type: object
      required: [code, title, how, risks]
      properties:
        code: { type: string }
        title: { type: string }
        how: { type: string }
        risks: { type: array, items: { type: string }, description: NASA HRP risk codes it lowers }

    ScheduleItem:
      type: object
      required: [code, title, every, fromHour, dueHour, indicators, manual]
      properties:
        code: { type: string }
        title: { type: string }
        every: { type: string, enum: [daily, weekly] }
        fromHour: { type: integer }
        dueHour: { type: integer }
        indicators: { type: [array, "null"], items: { type: string } }
        manual: { type: boolean }

    VehicleParameter:
      type: object
      required: [code, name, shortName, unit, system, min, max, step, freshnessMinutes, thresholds, about, guidance]
      properties:
        code: { type: string }
        name: { type: string }
        shortName: { type: string }
        unit: { type: string }
        system: { type: string, description: Body system it affects most }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        freshnessMinutes: { type: integer }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        about: { type: string }
        guidance:
          type: object
          required: [caution, critical]
          properties:
            caution: { $ref: "#/components/schemas/Advice" }
            critical: { $ref: "#/components/schemas/Advice" }

    Hazard:
      type: object
      required: [code, name, description, url]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string }

    Risk:
      type: object
      required: [code, name, description, url, hazards]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string }
        hazards: { type: array, items: { type: string } }

    Environment:
      type: object
      required: [code, name, description, gravityG, commDelayMinS, commDelayMaxS]
      properties:
        code: { $ref: "#/components/schemas/EnvironmentCode" }
        name: { type: string }
        description: { type: string }
        gravityG: { type: number }
        commDelayMinS: { type: integer, description: One-way signal delay to Earth, seconds }
        commDelayMaxS: { type: integer }

    BodySystem:
      type: object
      required: [code, name, description, weight, risks]
      properties:
        code: { type: string, description: "Body map zone id: cardiovascular, respiratory, immune, metabolic, behavioral, musculoskeletal, eyes" }
        name: { type: string }
        description: { type: string }
        weight: { type: number }
        risks: { type: array, items: { type: string } }

    Range:
      type: object
      required: [min, max]
      properties:
        min: { type: [number, "null"] }
        max: { type: [number, "null"] }

    Thresholds:
      type: object
      required: [nominal, caution]
      description: Inside nominal → nominal; else inside caution → caution; else critical. Inclusive bounds.
      properties:
        nominal: { $ref: "#/components/schemas/Range" }
        caution: { $ref: "#/components/schemas/Range" }

    Advice:
      type: object
      required: [title, action, recheckMinutes, escalate, supplies]
      properties:
        title: { type: string }
        action: { type: string }
        recheckMinutes: { type: integer }
        escalate: { type: boolean }
        supplies: { type: [array, "null"], items: { type: string }, description: Codes of medical supplies the action needs }

    Indicator:
      type: object
      required: [code, name, shortName, unit, system, input, scaleLabels, min, max, step, freshnessHours, trend, hazards, risks, thresholds, about, howToMeasure, whyInSpace, guidance]
      properties:
        code: { type: string }
        name: { type: string }
        shortName: { type: string, description: Compact label for tiles and tables }
        unit: { type: string }
        system: { type: string }
        input: { type: string, enum: [number, scale] }
        scaleLabels:
          type: [array, "null"]
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: integer }
              label: { type: string }
        min: { type: number, description: Lowest accepted input value }
        max: { type: number, description: Highest accepted input value }
        step: { type: number }
        freshnessHours: { type: integer, description: A reading older than this counts as unknown }
        trend: { type: boolean, description: Slow drift toward a limit is reported while still nominal }
        hazards: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        environmentThresholds:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Thresholds" }
        about: { type: string }
        howToMeasure: { type: array, items: { type: string } }
        whyInSpace: { type: string }
        guidance:
          type: object
          required: [caution, critical]
          properties:
            caution: { $ref: "#/components/schemas/Advice" }
            critical: { $ref: "#/components/schemas/Advice" }

    # --- mission and crew --------------------------------------------------------
    Phase:
      type: object
      required: [id, name, environment, startsAt, endsAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentCode" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, "null"], format: date-time }

    CurrentMission:
      type: object
      required: [id, name, startedAt, plannedEndAt, phases, missionDay, currentPhase, environment, now]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        startedAt: { type: string, format: date-time }
        plannedEndAt: { type: [string, "null"], format: date-time }
        phases: { type: array, items: { $ref: "#/components/schemas/Phase" } }
        missionDay: { type: integer, description: 1-based "Mission Day N" }
        currentPhase:
          oneOf:
            - $ref: "#/components/schemas/Phase"
            - type: "null"
        environment:
          oneOf:
            - $ref: "#/components/schemas/Environment"
            - type: "null"
        now: { type: string, format: date-time, description: Server time }

    Astronaut:
      type: object
      required: [id, missionId, name, role, module]
      properties:
        id: { type: integer, format: int64 }
        missionId: { type: integer, format: int64 }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        module: { type: string, description: Code of the module the member is in now; empty on Earth }

    # --- measurements ----------------------------------------------------------------
    MeasurementView:
      type: object
      required: [id, astronautId, indicator, value, unit, measuredAt, source, context, activityId, note, status, missionDay, environment]
      properties:
        id: { type: integer, format: int64 }
        astronautId: { type: integer, format: int64 }
        indicator: { type: string }
        value: { type: number }
        unit: { type: string }
        measuredAt: { type: string, format: date-time }
        source: { type: string, enum: [manual, device, questionnaire] }
        context: { type: string, enum: ["", pre_eva, post_eva] }
        activityId: { type: [integer, "null"], format: int64 }
        note: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        missionDay: { type: integer }
        environment: { type: string, description: Environment code at measurement time, empty if outside any phase }

    NewMeasurement:
      type: object
      required: [indicator, value]
      additionalProperties: false
      properties:
        indicator: { type: string }
        value: { type: number }
        measuredAt: { type: string, format: date-time, description: Defaults to now }
        context: { type: string, enum: ["", pre_eva, post_eva] }
        note: { type: string }
        source: { type: string, enum: ["", device], description: device when read from a sensor; self-report answers cannot be device }

    CreateMeasurementsRequest:
      type: object
      required: [measurements]
      additionalProperties: false
      properties:
        measurements:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/NewMeasurement" }

    Activity:
      type: object
      required: [id, astronautId, kind, startsAt, endsAt, note]
      properties:
        id: { type: integer, format: int64 }
        astronautId: { type: integer, format: int64 }
        kind: { type: string, enum: [eva, landing] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        note: { type: string }

    # --- assessment ----------------------------------------------------------------
    IndicatorResult:
      type: object
      required: [code, system, status, fresh, value, unit, measuredAt, environment, nominal, personal, baseline]
      properties:
        code: { type: string }
        system: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        fresh: { type: boolean, description: false → status is unknown, value is the last stale reading }
        value: { type: [number, "null"] }
        unit: { type: string }
        measuredAt: { type: [string, "null"], format: date-time }
        environment: { type: string }
        nominal: { $ref: "#/components/schemas/Range" }
        personal: { type: boolean, description: A personal range set by the flight surgeon applies }
        baseline: { type: [number, "null"], description: Preflight value }

    SystemResult:
      type: object
      required: [code, status, score, indicators]
      properties:
        code: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        score: { type: [integer, "null"] }
        indicators: { type: array, items: { $ref: "#/components/schemas/IndicatorResult" } }

    Readiness:
      type: object
      required: [astronautId, missionDay, environment, score, status, cappedByCritical, completeness, systems, assessedAt]
      properties:
        astronautId: { type: integer, format: int64 }
        missionDay: { type: integer }
        environment: { type: string }
        score: { type: [integer, "null"], description: 0..100; null when there is no fresh data }
        status: { $ref: "#/components/schemas/Status" }
        cappedByCritical: { type: boolean, description: A critical indicator capped the score at 49 }
        completeness: { type: number, description: Share of indicators with a fresh reading, 0..1 }
        systems: { type: array, items: { $ref: "#/components/schemas/SystemResult" } }
        assessedAt: { type: string, format: date-time }

    Recommendation:
      type: object
      required: [id, rule, indicator, system, severity, title, action, basis, recheckMinutes, escalate, escalateReason, risks, parameter, supplies]
      properties:
        id: { type: string }
        rule: { type: string, enum: [indicator_status, repeated_critical, sleep_debt, post_eva_hypoxia, low_mood_streak, cabin_air, trend] }
        indicator: { type: string }
        system: { type: string }
        severity: { $ref: "#/components/schemas/Status" }
        title: { type: string }
        action: { type: string }
        basis: { type: string, description: Why it fired, with the numbers }
        recheckMinutes: { type: integer, description: 0 = no specific re-check }
        escalate: { type: boolean, description: Report to the flight surgeon }
        escalateReason: { type: string }
        risks: { type: array, items: { type: string }, description: NASA HRP risk codes }
        parameter: { type: string, description: Vehicle parameter for cabin_air advice; empty otherwise }
        supplies: { type: array, items: { $ref: "#/components/schemas/SupplyRef" }, description: What the action needs from the medical kit, with stock and location }

    Guidance:
      type: object
      required: [astronautId, environment, commDelayMinS, commDelayMaxS, recommendations]
      properties:
        astronautId: { type: integer, format: int64 }
        environment: { type: string }
        commDelayMinS: { type: integer }
        commDelayMaxS: { type: integer }
        recommendations: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }

    # --- access -------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, description: Case-insensitive }
        password: { type: string }

    Session:
      type: object
      required: [user, username]
      properties:
        user: { $ref: "#/components/schemas/Astronaut" }
        username: { type: string }

    DemoAccounts:
      type: object
      required: [password, accounts]
      properties:
        password: { type: string, description: Shared password of every demo account }
        accounts:
          type: array
          items:
            type: object
            required: [username, name, role]
            properties:
              username: { type: string }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }

    # --- crew overview and report ---------------------------------------------------
    Assessment:
      type: object
      required: [score, status, cappedByCritical, completeness, systems, assessedAt]
      properties:
        score: { type: [integer, "null"] }
        status: { $ref: "#/components/schemas/Status" }
        cappedByCritical: { type: boolean }
        completeness: { type: number }
        systems: { type: array, items: { $ref: "#/components/schemas/SystemResult" } }
        assessedAt: { type: string, format: date-time }

    TrendPoint:
      type: object
      required: [t, v, status]
      properties:
        t: { type: string, format: date-time }
        v: { type: number }
        status: { $ref: "#/components/schemas/Status" }

    TrendSeries:
      type: object
      required: [indicator, points]
      properties:
        indicator: { type: string }
        points: { type: array, items: { $ref: "#/components/schemas/TrendPoint" } }

    CrewMember:
      type: object
      required: [astronaut, readiness, warnings, cautions, escalate, recommendations, trends, tasks]
      properties:
        astronaut: { $ref: "#/components/schemas/Astronaut" }
        readiness: { $ref: "#/components/schemas/Assessment" }
        warnings: { type: integer }
        cautions: { type: integer }
        escalate: { type: boolean }
        recommendations: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
        trends: { type: array, items: { $ref: "#/components/schemas/TrendSeries" }, description: Last 7 days, one series per catalog indicator }
        tasks:
          type: object
          required: [done, total, overdue, streak]
          properties:
            done: { type: integer }
            total: { type: integer }
            overdue: { type: integer }
            streak: { type: integer }

    CrewOverview:
      type: object
      required: [generatedAt, missionDay, members]
      properties:
        generatedAt: { type: string, format: date-time }
        missionDay: { type: integer }
        members: { type: array, items: { $ref: "#/components/schemas/CrewMember" } }

    Report:
      type: object
      required: [generatedAt, mission, astronaut, readiness, escalate, alerts, stale, recommendations, trends, cabin, disclaimer]
      properties:
        generatedAt: { type: string, format: date-time }
        mission:
          type: object
          required: [name, startedAt, day, phase, environment, gravityG, commDelayMinS, commDelayMaxS]
          properties:
            name: { type: string }
            startedAt: { type: string, format: date-time }
            day: { type: integer }
            phase: { type: string }
            environment: { type: string }
            gravityG: { type: number }
            commDelayMinS: { type: integer }
            commDelayMaxS: { type: integer }
        astronaut: { $ref: "#/components/schemas/Astronaut" }
        readiness:
          type: object
          required: [score, status, cappedByCritical, freshIndicators, totalIndicators]
          properties:
            score: { type: [integer, "null"] }
            status: { $ref: "#/components/schemas/Status" }
            cappedByCritical: { type: boolean }
            freshIndicators: { type: integer }
            totalIndicators: { type: integer }
        escalate: { type: boolean }
        alerts:
          type: array
          items:
            type: object
            required: [indicator, name, value, display, status, direction, nominal, measuredAt]
            properties:
              indicator: { type: string }
              name: { type: string }
              value: { type: number }
              display: { type: string, description: Value with unit or a scale score }
              status: { $ref: "#/components/schemas/Status" }
              direction: { type: string, enum: [above, below] }
              nominal: { type: string }
              measuredAt: { type: string, format: date-time }
        stale:
          type: array
          items:
            type: object
            required: [indicator, name, lastMeasuredAt]
            properties:
              indicator: { type: string }
              name: { type: string }
              lastMeasuredAt: { type: [string, "null"], format: date-time }
        recommendations: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
        trends:
          type: array
          items:
            type: object
            required: [indicator, name, unit, nominal, readings, min, max, mean, last, change, offNominal]
            properties:
              indicator: { type: string }
              name: { type: string }
              unit: { type: string }
              nominal: { type: string }
              readings: { type: integer }
              min: { type: [number, "null"] }
              max: { type: [number, "null"] }
              mean: { type: [number, "null"] }
              last: { type: [number, "null"] }
              change: { type: [number, "null"], description: Last minus first reading in the window }
              offNominal: { type: integer }
        cabin:
          description: Air in the member's module now and over 7 days; null when not in a module
          oneOf:
            - type: "null"
            - type: object
              required: [module, name, parameters]
              properties:
                module: { type: string }
                name: { type: string }
                parameters:
                  type: array
                  items:
                    type: object
                    required: [parameter, name, unit, nominal, status, value, min, max, offNominal]
                    properties:
                      parameter: { type: string }
                      name: { type: string }
                      unit: { type: string }
                      nominal: { type: string }
                      status: { $ref: "#/components/schemas/Status" }
                      value: { type: [number, "null"] }
                      min: { type: [number, "null"] }
                      max: { type: [number, "null"] }
                      offNominal: { type: integer }
        disclaimer: { type: string }

    # --- vehicle and supplies (P2) ---------------------------------------------------
    IngestRequest:
      type: object
      additionalProperties: false
      properties:
        telemetry:
          type: array
          items:
            type: object
            required: [module, parameter, value]
            additionalProperties: false
            properties:
              module: { type: string }
              parameter: { type: string }
              value: { type: number }
              measuredAt: { type: string, format: date-time, description: Defaults to now }
        measurements:
          type: array
          items:
            type: object
            required: [astronautId, indicator, value]
            additionalProperties: false
            properties:
              astronautId: { type: integer, format: int64 }
              indicator: { type: string, description: Sensor indicators only (no self-report scales) }
              value: { type: number }
              measuredAt: { type: string, format: date-time }

    VehicleParameterResult:
      type: object
      required: [code, status, fresh, value, unit, measuredAt]
      properties:
        code: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        fresh: { type: boolean }
        value: { type: [number, "null"] }
        unit: { type: string }
        measuredAt: { type: [string, "null"], format: date-time }

    VehicleModule:
      type: object
      required: [code, name, status, crew, parameters]
      properties:
        code: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        crew:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        parameters: { type: array, items: { $ref: "#/components/schemas/VehicleParameterResult" } }

    Vehicle:
      type: object
      required: [status, modules, assessedAt]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        modules: { type: array, items: { $ref: "#/components/schemas/VehicleModule" } }
        assessedAt: { type: string, format: date-time }

    TelemetryView:
      type: object
      required: [module, parameter, value, unit, measuredAt, source, status]
      properties:
        module: { type: string }
        parameter: { type: string }
        value: { type: number }
        unit: { type: string }
        measuredAt: { type: string, format: date-time }
        source: { type: string }
        status: { $ref: "#/components/schemas/Status" }

    SupplyRef:
      type: object
      required: [code, name, quantity, unit, location, status]
      properties:
        code: { type: string }
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
        location: { type: string }
        status: { $ref: "#/components/schemas/Status" }

    SupplyItem:
      type: object
      required: [id, code, name, category, unit, quantity, minQuantity, location, expiresAt, lastCountedAt, discrepancy, status, advisory, reasons, dailyUse, runsOutAt, lastsMission]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [medication, consumable, equipment, oxygen] }
        unit: { type: string }
        quantity: { type: number }
        minQuantity: { type: number }
        location: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
        lastCountedAt: { type: [string, "null"], format: date-time }
        discrepancy: { type: number, description: Counted minus expected at the last count }
        status: { $ref: "#/components/schemas/Status" }
        advisory: { type: boolean, description: Inventory count due }
        reasons: { type: array, items: { type: string } }
        dailyUse: { type: number }
        runsOutAt: { type: [string, "null"], format: date-time }
        lastsMission: { type: boolean }

    Supplies:
      type: object
      required: [items, missionEndAt, assessedAt]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SupplyItem" } }
        missionEndAt: { type: [string, "null"], format: date-time }
        assessedAt: { type: string, format: date-time }

    JournalEntry:
      type: object
      required: [id, supplyId, astronautId, kind, delta, quantityAfter, reason, recommendationId, createdAt, supplyName, unit, astronautName]
      properties:
        id: { type: integer, format: int64 }
        supplyId: { type: integer, format: int64 }
        astronautId: { type: [integer, "null"], format: int64 }
        kind: { type: string, enum: [use, count, dispose] }
        delta: { type: number }
        quantityAfter: { type: number }
        reason: { type: string }
        recommendationId: { type: string }
        createdAt: { type: string, format: date-time }
        supplyName: { type: string }
        unit: { type: string }
        astronautName: { type: string, description: Empty when nobody in particular }

    # --- passkeys (P2) -------------------------------------------------------------
    Passkey:
      type: object
      required: [id, alg, label, createdAt, lastUsedAt]
      properties:
        id: { type: string, description: Credential ID, base64url }
        alg: { type: integer, description: COSE algorithm (-7 ES256, -257 RS256) }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }

    PasskeyRegisterOptions:
      type: object
      required: [challenge, rp, user, pubKeyCredParams, excludeCredentialIds, timeout]
      properties:
        challenge: { type: string }
        rp:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        user:
          type: object
          required: [id, name, displayName]
          properties:
            id: { type: string, description: base64url }
            name: { type: string }
            displayName: { type: string }
        pubKeyCredParams:
          type: array
          items:
            type: object
            required: [type, alg]
            properties:
              type: { type: string }
              alg: { type: integer }
        excludeCredentialIds: { type: array, items: { type: string } }
        timeout: { type: integer }

    # --- profile and tasks (P1) -----------------------------------------------------
    PersonalIndicator:
      type: object
      properties:
        baseline: { type: [number, "null"], description: Preflight value }
        thresholds:
          description: Personal ranges; null = standard catalog ranges
          oneOf:
            - $ref: "#/components/schemas/Thresholds"
            - type: "null"
        note: { type: string }

    Profile:
      type: object
      required: [conditions, indicators, weights]
      properties:
        conditions: { type: string }
        indicators: { type: object, additionalProperties: { $ref: "#/components/schemas/PersonalIndicator" } }
        weights: { type: object, additionalProperties: { type: number }, description: System code → weight in the Readiness Score }

    Task:
      type: object
      required: [code, title, every, manual, indicators, missing, due, done, doneAt, overdue]
      properties:
        code: { type: string }
        title: { type: string }
        every: { type: string, enum: [daily, weekly] }
        manual: { type: boolean }
        indicators: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string }, description: Indicators still without a reading in the window }
        due: { type: string, format: date-time }
        done: { type: boolean }
        doneAt: { type: [string, "null"], format: date-time }
        overdue: { type: boolean }

    Badge:
      type: object
      required: [code, title, description, earnedAt]
      properties:
        code: { type: string }
        title: { type: string }
        description: { type: string }
        earnedAt: { type: string, format: date-time }

    Tasks:
      type: object
      required: [day, tasks, done, total, overdue, streak, bestStreak, badges]
      properties:
        day: { type: string, description: Mission-UTC day, YYYY-MM-DD }
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        done: { type: integer }
        total: { type: integer }
        overdue: { type: integer }
