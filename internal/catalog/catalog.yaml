# AURA indicator catalog — the single source of all health content.
#
# Edit texts freely (names, about, how_to_measure, why_in_space, guidance).
# Keep codes, units and thresholds consistent; `go test ./...` validates the file.
#
# Thresholds: a value inside `nominal` is nominal; otherwise inside `caution`
# is caution; otherwise critical. Bounds are inclusive; null = open bound.
# Ranges are ILLUSTRATIVE general clinical references for healthy adults at
# rest — the challenge resources (NASA HRP, CSA) give no numeric limits.
# See docs/RESOURCES.md in the team workspace.

disclaimer: >-
  AURA is a hackathon prototype, not a medical device. Ranges and
  recommendations are illustrative and must not be used for medical decisions.

thresholds_note: >-
  Illustrative ranges based on general clinical references for healthy adults
  at rest. NASA Human Research Program resources define which risks matter,
  not numeric limits.

# --- NASA HRP: 5 hazards of human spaceflight ---------------------------------
# Source: https://www.nasa.gov/hrp/hazards/
hazards:
  - code: radiation
    name: Space radiation
    description: Invisible and considered one of the most hazardous aspects of spaceflight.
    url: https://www.nasa.gov/hrp/hazards/
  - code: isolation
    name: Isolation and confinement
    description: Behavioral responses of small groups isolated in a small space for months or years.
    url: https://www.nasa.gov/hrp/hazards/
  - code: distance
    name: Distance from Earth
    description: Instructions, supplies and medical care get harder to receive the farther the crew travels.
    url: https://www.nasa.gov/hrp/hazards/
  - code: gravity
    name: Gravity fields
    description: Muscles, bones, inner ear and organs adjust to weightlessness, Moon or Mars gravity, and Earth again.
    url: https://www.nasa.gov/hrp/hazards/
  - code: hostile_environment
    name: Hostile and closed environments
    description: Temperature, pressure, lighting, noise and microbes inside the vehicle shape crew health.
    url: https://www.nasa.gov/hrp/hazards/

# --- NASA HRP: specific risks -------------------------------------------------
# Source: https://www.nasa.gov/hrp/risks/
risks:
  - code: immune
    name: Altered immune system responses
    description: Spaceflight stress can reactivate dormant viruses and change immunity.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [radiation, isolation, hostile_environment]
  - code: sensorimotor
    name: Altered sensorimotor and vestibular function
    description: Motion sickness, dizziness and poor coordination during gravity transitions.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [gravity]
  - code: cardiovascular
    name: Cardiovascular adaptations
    description: Weightlessness alters circulation and heart function, raising the risk of cardiovascular events.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [gravity, radiation]
  - code: decompression
    name: Decompression sickness
    description: Moving from the cabin to a lower-pressure suit can make dissolved nitrogen bubble in tissues.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [hostile_environment]
  - code: microbiome
    name: Host-microorganism interactions
    description: Skin and gut microbiomes change in space and may make crew members sick.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [hostile_environment]
  - code: hypoxia
    name: Hypoxia
    description: Protocols that prevent "the bends" on spacewalks raise the risk of mild oxygen deficiency.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [hostile_environment]
  - code: nutrition
    name: Inadequate food and nutrition
    description: A balanced diet is essential for crew health and performance on long missions.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [distance, hostile_environment]
  - code: eva
    name: Injury and compromised performance during spacewalks
    description: Suit work brings fatigue, injury risk, low oxygen and high carbon dioxide.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [hostile_environment, gravity]
  - code: fitness
    name: Reduced cardiorespiratory and musculoskeletal fitness
    description: Exercise counters loss of bone, muscle strength and heart performance.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [gravity]
  - code: sans
    name: Spaceflight Associated Neuro-ocular Syndrome (SANS)
    description: The structure of the eyes and brain can change during spaceflight.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [gravity]
  - code: bone
    name: Spaceflight-induced bone changes
    description: Without gravity bones break down and become brittle.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [gravity]
  - code: behavioral
    name: Behavioral changes and psychiatric disorders
    description: Isolation, radiation and distance from Earth take a toll on mental health.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [isolation, distance, radiation]
  - code: teamwork
    name: Inadequate teamwork
    description: Crews in prolonged isolation must work well together and recover quickly from setbacks.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [isolation, distance]
  - code: sleep
    name: Inadequate sleep and irregular schedules
    description: Chronic sleep loss, constant work demands and disrupted body clocks.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [isolation, hostile_environment]
  - code: dynamic_loads
    name: Injury from dynamic loads
    description: Crews risk injury during landing.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [gravity]
  - code: radiation_cancer
    name: Radiation-induced cancers
    description: Space radiation exposure may raise long-term cancer risk.
    url: https://www.nasa.gov/hrp/risks/
    hazards: [radiation]

# --- Mission environments -----------------------------------------------------
environments:
  - code: iss
    name: Low Earth orbit station
    description: Weightlessness; ground support is seconds away.
    gravity_g: 0
    comm_delay_min_s: 0
    comm_delay_max_s: 2
  - code: lunar_surface
    name: Lunar surface base
    description: One-sixth gravity, lunar dust, about 1.3 s signal delay.
    gravity_g: 0.17
    comm_delay_min_s: 1
    comm_delay_max_s: 2
  - code: mars_transit
    name: Earth–Mars transit
    description: Weightlessness far from Earth; the crew must be self-sufficient.
    gravity_g: 0
    comm_delay_min_s: 180
    comm_delay_max_s: 1320
  - code: mars_surface
    name: Mars surface base
    description: Three-eighths of Earth gravity; replies from Earth take minutes.
    gravity_g: 0.38
    comm_delay_min_s: 180
    comm_delay_max_s: 1320

# --- Body systems (body map zones) --------------------------------------------
systems:
  - code: cardiovascular
    name: Heart & circulation
    description: Weightlessness shifts fluids toward the head and deconditions the heart and vessels.
    weight: 1
    risks: [cardiovascular, fitness]
  - code: respiratory
    name: Lungs & oxygen
    description: Blood oxygen reflects cabin air quality and suit conditions during spacewalks.
    weight: 1
    risks: [hypoxia, decompression, eva]
  - code: immune
    name: Immunity & temperature
    description: Spaceflight stress can weaken immunity; body temperature is an early sign of infection.
    weight: 1
    risks: [immune, microbiome]
  - code: metabolic
    name: Metabolism & nutrition
    description: Diet, energy and blood sugar on missions where resupply is impossible.
    weight: 1
    risks: [nutrition]
  - code: behavioral
    name: Mind & sleep
    description: Sleep, mood and stress under isolation, confinement and constant workload.
    weight: 1
    risks: [behavioral, sleep, teamwork]
  - code: musculoskeletal
    name: Bones & muscles
    description: Bone and muscle loss in low gravity, countered by daily exercise.
    weight: 1
    risks: [bone, fitness, dynamic_loads]
  - code: eyes
    name: Eyes & brain
    description: Fluid shifts can change the eyes and brain (SANS).
    weight: 1
    risks: [sans, sensorimotor]

# --- Indicators -----------------------------------------------------------------
indicators:
  - code: heart_rate
    name: Resting heart rate
    short_name: Pulse
    unit: bpm
    system: cardiovascular
    input: number
    min: 20
    max: 250
    step: 1
    freshness_hours: 24
    hazards: [gravity, hostile_environment]
    risks: [cardiovascular, fitness, eva]
    # Source: general clinical reference, adult resting HR 60–100 bpm (AHA);
    # lower bound relaxed to 50 for trained astronauts.
    thresholds:
      nominal: {min: 50, max: 100}
      caution: {min: 40, max: 120}
    about: Number of heartbeats per minute at rest.
    how_to_measure:
      - Sit still for 5 minutes before measuring.
      - Put on the finger pulse sensor or wrist monitor.
      - Record the value after the reading is stable for 30 seconds.
    why_in_space: Fluid shifts and heart deconditioning change heart rate; a high resting rate can signal stress, fever, dehydration or overexertion after a spacewalk.
    guidance:
      caution:
        title: Heart rate outside the normal range
        action: Rest seated for 10 minutes, drink water, avoid exercise, then re-measure.
        recheck_minutes: 15
        escalate: false
      critical:
        title: Heart rate is critically abnormal
        action: Stop all activity, lie down, tell a crewmate and re-measure in 5 minutes. If still critical, follow the cardiac protocol.
        recheck_minutes: 5
        escalate: true

  - code: bp_systolic
    name: Blood pressure (systolic)
    short_name: Systolic pressure
    unit: mmHg
    system: cardiovascular
    input: number
    min: 50
    max: 260
    step: 1
    freshness_hours: 24
    trend: true
    hazards: [gravity]
    risks: [cardiovascular]
    # Source: 2018 ESC/ESH hypertension guidelines — optimal and normal up to
    # 129 mmHg, high normal and grade 1 up to 159, grade 2 from 160; hypotension
    # below 90. Simplified to three bands.
    thresholds:
      nominal: {min: 90, max: 129}
      caution: {min: 80, max: 159}
    about: The pressure in your arteries when the heart beats (upper number).
    how_to_measure:
      - Sit with your back supported and feet secured for 5 minutes.
      - Put the cuff on the bare upper arm at heart level.
      - Do not talk or move during the reading; record both numbers.
    why_in_space: Weightlessness pushes fluids toward the head and changes how the heart and vessels work, which raises cardiovascular risk.
    guidance:
      caution:
        title: Blood pressure is outside the normal range
        action: Rest seated for 15 minutes and re-measure in the evening. If high — reduce salt and caffeine today; if low — drink water and stand up slowly.
        recheck_minutes: 240
        escalate: false
        supplies: [bp_cuff]
      critical:
        title: Blood pressure is critically abnormal
        action: Stop physical work, sit down (lie down if you feel faint), breathe slowly and re-measure in 5 minutes.
        recheck_minutes: 5
        escalate: false
        supplies: [bp_cuff]

  - code: bp_diastolic
    name: Blood pressure (diastolic)
    short_name: Diastolic pressure
    unit: mmHg
    system: cardiovascular
    input: number
    min: 30
    max: 160
    step: 1
    freshness_hours: 24
    trend: true
    hazards: [gravity]
    risks: [cardiovascular]
    # Source: 2018 ESC/ESH hypertension guidelines — optimal and normal up to
    # 84 mmHg, high normal and grade 1 up to 99, grade 2 from 100; hypotension
    # below 60. Simplified to three bands.
    thresholds:
      nominal: {min: 60, max: 84}
      caution: {min: 50, max: 99}
    about: The pressure in your arteries between heartbeats (lower number).
    how_to_measure:
      - Measured together with systolic pressure — use the same cuff reading.
    why_in_space: Diastolic pressure reacts to fluid shifts and stress in the same way as systolic pressure.
    guidance:
      caution:
        title: Diastolic pressure is outside the normal range
        action: Rest seated for 15 minutes and re-measure in the evening. If high — reduce salt and caffeine today; if low — drink water and stand up slowly.
        recheck_minutes: 240
        escalate: false
      critical:
        title: Diastolic pressure is critically abnormal
        action: Stop physical work, sit down (lie down if you feel faint), breathe slowly and re-measure in 5 minutes.
        recheck_minutes: 5
        escalate: false

  - code: spo2
    name: Blood oxygen (SpO₂)
    short_name: SpO₂
    unit: "%"
    system: respiratory
    input: number
    min: 50
    max: 100
    step: 1
    freshness_hours: 24
    hazards: [hostile_environment]
    risks: [hypoxia, decompression, eva]
    # Source: general clinical reference, normal SpO2 95–100 %.
    thresholds:
      nominal: {min: 95, max: null}
      caution: {min: 92, max: null}
    about: How much of your blood's hemoglobin carries oxygen.
    how_to_measure:
      - Warm your hands; remove anything from the fingertip.
      - Clip the pulse oximeter on and keep the hand still at heart level.
      - Record the value after 30 seconds of a stable reading.
    why_in_space: Low oxygen can come from cabin air problems or from suit conditions during a spacewalk (hypoxia, decompression).
    guidance:
      caution:
        title: Blood oxygen is below normal
        action: Check the sensor placement, sit upright, breathe deeply for 2 minutes and re-measure. Check cabin CO₂ and O₂ readings.
        recheck_minutes: 10
        escalate: false
        supplies: [pulse_oximeter]
      critical:
        title: Blood oxygen is critically low
        action: Stop activity, switch to supplemental oxygen if available, check cabin atmosphere and re-measure immediately.
        recheck_minutes: 2
        escalate: true
        supplies: [oxygen_mask, oxygen_cylinder]

  - code: body_temp
    name: Body temperature
    short_name: Temperature
    unit: "°C"
    system: immune
    input: number
    min: 30
    max: 43
    step: 0.1
    freshness_hours: 24
    hazards: [hostile_environment, isolation]
    risks: [immune, microbiome]
    # Source: general clinical reference, normal 36.1–37.5 °C; a low-grade
    # fever up to 38.4 °C is Caution, 38.5 °C and above is Warning.
    thresholds:
      nominal: {min: 36.1, max: 37.5}
      caution: {min: 35.5, max: 38.4}
    about: Core body temperature measured with the ear or forehead thermometer.
    how_to_measure:
      - Wait 15 minutes after exercise, food or drinks.
      - Measure with the ear thermometer, same ear each time.
      - Record the value; if it seems off, measure again.
    why_in_space: Spaceflight stress can reactivate dormant viruses; fever is an early sign of infection in a closed environment.
    guidance:
      caution:
        title: Body temperature is outside the normal range
        action: Rest, drink fluids, watch for symptoms (rash, sore throat, chills) and re-measure in 2 hours.
        recheck_minutes: 120
        escalate: false
      critical:
        title: Body temperature is critically abnormal
        action: Stop work, isolate from the crew if infection is possible, start the fever protocol and re-measure in 30 minutes.
        recheck_minutes: 30
        escalate: true
        supplies: [thermometer]

  - code: glucose
    name: Blood glucose
    short_name: Glucose
    unit: mg/dL
    system: metabolic
    input: number
    min: 20
    max: 600
    step: 1
    freshness_hours: 48
    hazards: [distance, hostile_environment]
    risks: [nutrition]
    # Source: general clinical reference; ADA glycemic levels — hypoglycemia
    # level 1 <70, level 2 <54 mg/dL; hyperglycemia level 1 >180, level 2
    # >250 mg/dL; 140 mg/dL is the upper post-meal reference without diabetes.
    thresholds:
      nominal: {min: 70, max: 140}
      caution: {min: 54, max: 250}
    about: Sugar level in your blood from a finger-prick glucometer.
    how_to_measure:
      - Wash and dry your hands.
      - Prick the side of a fingertip and touch the strip to the drop.
      - Note whether you ate in the last 2 hours.
    why_in_space: Nutrition is limited on long missions; blood sugar reflects whether energy intake matches the workload.
    guidance:
      caution:
        title: Blood glucose is outside the normal range
        action: If low — eat a snack with fast carbohydrates; if high — skip sweets and drink water. Re-measure in 1 hour.
        recheck_minutes: 60
        escalate: false
        supplies: [glucose_gel, glucose_strips]
      critical:
        title: Blood glucose is critically abnormal
        action: If low — take 15 g of fast carbohydrates now and re-measure in 15 minutes. If high — drink water and re-measure.
        recheck_minutes: 15
        escalate: true
        supplies: [glucose_gel, glucose_strips]

  - code: sleep_hours
    name: Sleep last night
    short_name: Sleep
    unit: h
    system: behavioral
    input: number
    min: 0
    max: 24
    step: 0.25
    freshness_hours: 24
    trend: true
    hazards: [isolation, hostile_environment]
    risks: [sleep, behavioral]
    # Source: adult sleep recommendation 7–9 h (AASM / National Sleep Foundation).
    # Warning only below 5 h: ISS crews average about 6 h a night (Barger et al.,
    # Lancet Neurology 2014), so one 6-hour night is Caution, not Warning.
    thresholds:
      nominal: {min: 7, max: 9}
      caution: {min: 5, max: null}
    about: Hours you actually slept during the last sleep period.
    how_to_measure:
      - Right after waking, estimate the hours you slept (or take the value from the wrist sensor).
    why_in_space: Chronic sleep loss and disrupted body clocks are a known HRP risk; fatigue causes errors in critical operations.
    guidance:
      caution:
        title: Sleep is outside the recommended 7–9 h
        action: If short — plan a 20-minute nap, avoid caffeine after midday and dim lights an hour before sleep. If long — note how rested you feel; oversleeping can be a sign of fatigue or illness.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Severe lack of sleep
        action: Avoid critical tasks today if possible, tell the commander, take a nap and go to bed on time.
        recheck_minutes: 0
        escalate: false

  - code: mood
    name: Mood
    short_name: Mood
    unit: score
    system: behavioral
    input: scale
    min: 1
    max: 5
    step: 1
    freshness_hours: 24
    hazards: [isolation, distance]
    risks: [behavioral, teamwork]
    scale_labels:
      - {value: 1, label: Very low}
      - {value: 2, label: Low}
      - {value: 3, label: Neutral}
      - {value: 4, label: Good}
      - {value: 5, label: Great}
    # Self-report scale; bands chosen for the prototype.
    thresholds:
      nominal: {min: 4, max: 5}
      caution: {min: 3, max: 5}
    about: How you feel today, from 1 (very low) to 5 (great).
    how_to_measure:
      - Answer honestly in the morning check-in; there are no wrong answers.
    why_in_space: Isolation and distance from family affect mental health; tracking mood helps catch problems early.
    guidance:
      caution:
        title: Your mood is lower than usual
        action: Take a short break, talk to a crewmate, schedule a call or message home.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Your mood is very low
        action: Tell a crewmate you trust and request a private conference with the psychologist.
        recheck_minutes: 0
        escalate: false

  - code: stress
    name: Stress
    short_name: Stress
    unit: score
    system: behavioral
    input: scale
    min: 1
    max: 5
    step: 1
    freshness_hours: 24
    hazards: [isolation, distance]
    risks: [behavioral, sleep]
    scale_labels:
      - {value: 1, label: Calm}
      - {value: 2, label: Mild}
      - {value: 3, label: Moderate}
      - {value: 4, label: High}
      - {value: 5, label: Overwhelming}
    # Self-report scale; bands chosen for the prototype.
    thresholds:
      nominal: {min: 1, max: 2}
      caution: {min: 1, max: 3}
    about: How stressed you feel today, from 1 (calm) to 5 (overwhelming).
    how_to_measure:
      - Answer in the morning check-in, thinking about the last 24 hours.
    why_in_space: Constant workload in a confined space builds stress, which harms sleep, immunity and teamwork.
    guidance:
      caution:
        title: Stress is building up
        action: Do a 5-minute breathing exercise and review today's tasks with the commander.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Stress is very high
        action: Ask the commander to reprioritize your tasks and book a session with the psychologist.
        recheck_minutes: 0
        escalate: false

  - code: headache
    name: Headache
    short_name: Headache
    unit: score
    system: eyes
    input: scale
    min: 1
    max: 5
    step: 1
    freshness_hours: 24
    hazards: [hostile_environment, gravity]
    risks: [sans, behavioral]
    scale_labels:
      - {value: 1, label: None}
      - {value: 2, label: Mild}
      - {value: 3, label: Moderate}
      - {value: 4, label: Strong}
      - {value: 5, label: Severe}
    # Self-report scale; bands chosen for the prototype. Headaches on the ISS
    # are linked to elevated cabin CO₂ and to fluid shifts (SANS).
    thresholds:
      nominal: {min: 1, max: 2}
      caution: {min: 1, max: 3}
    about: How strong your headache is today, from 1 (none) to 5 (severe).
    how_to_measure:
      - Answer in the morning check-in, thinking about the last 24 hours.
      - Note if the headache started in a particular module.
    why_in_space: In a sealed cabin, carbon dioxide can build up where air does not mix; headache is one of its first signs. Fluid shifts toward the head add to it.
    guidance:
      caution:
        title: Headache
        action: Drink water, take a break in another module and check the cabin CO₂ reading where you work and sleep.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Strong headache
        action: Stop strenuous work, move to a module with nominal CO₂, check your vision for changes and report it at the next medical conference.
        recheck_minutes: 60
        escalate: true
  - code: body_mass_change
    name: Body mass change from preflight
    short_name: Body mass
    unit: '%'
    system: musculoskeletal
    input: number
    min: -30
    max: 30
    step: 0.1
    freshness_hours: 192
    trend: true
    hazards: [gravity, distance]
    risks: [nutrition, bone, fitness]
    # Illustrative: ISS crews lose ~1–5 % of body mass; > 5 % needs a nutrition review.
    thresholds:
      nominal: {min: -2, max: 2}
      caution: {min: -5, max: 5}
    about: Change of body mass compared with your preflight mass, in percent.
    how_to_measure:
      - Weigh yourself once a week, in the morning, after the toilet and before breakfast.
      - On Mars use the habitat scale; in weightlessness the mass-measurement device.
    why_in_space: Losing mass means you eat less than you burn — muscles and bones pay for it, and that cannot be fixed quickly far from Earth.
    guidance:
      caution:
        title: Body mass is changing
        action: Log every meal for 3 days, add an extra snack and review the menu with the flight surgeon.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Large body mass change
        action: Discuss a nutrition plan with the flight surgeon at the next conference and weigh yourself every 3 days.
        recheck_minutes: 0
        escalate: true
  - code: exercise_minutes
    name: Exercise yesterday
    short_name: Exercise
    unit: min
    system: musculoskeletal
    input: number
    min: 0
    max: 600
    step: 5
    freshness_hours: 36
    trend: true
    hazards: [gravity]
    risks: [bone, fitness, cardiovascular]
    # Illustrative: ISS crews exercise about 2 h a day (2.5 h scheduled with
    # setup and cleanup).
    thresholds:
      nominal: {min: 120, max: null}
      caution: {min: 60, max: null}
    about: Minutes of planned exercise (resistance, treadmill, cycle) yesterday.
    how_to_measure:
      - Answer in the morning check-in from your exercise log for yesterday.
    why_in_space: Low gravity removes the daily load that keeps bones and muscles strong; exercise is the main countermeasure.
    guidance:
      caution:
        title: Less exercise than planned
        action: Make up the missing time today — resistance first, then aerobic.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Exercise was skipped
        action: Schedule a full exercise session today and tell the commander if the workload does not allow it.
        recheck_minutes: 0
        escalate: false
  - code: water_intake
    name: Water yesterday
    short_name: Water
    unit: L
    system: metabolic
    input: number
    min: 0
    max: 10
    step: 0.1
    freshness_hours: 36
    hazards: [hostile_environment]
    risks: [nutrition, bone]
    # Illustrative: 2–2.5 L/day; low intake raises the kidney-stone risk of bone loss.
    thresholds:
      nominal: {min: 2.0, max: null}
      caution: {min: 1.5, max: null}
    about: How much you drank yesterday, in litres.
    how_to_measure:
      - Answer in the morning check-in from your drink bag count for yesterday.
    why_in_space: Calcium from bone loss can form kidney stones; drinking enough is the simplest protection.
    guidance:
      caution:
        title: Drinking too little
        action: Keep a drink bag with you and aim for 2.5 L today.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Very low water intake
        action: Drink 500 ml now and spread another 2 L over the day; tell the flight surgeon about any flank pain.
        recheck_minutes: 0
        escalate: false
  - code: radiation_dose
    name: Personal radiation dose, last 24 h
    short_name: Dose
    unit: mGy
    system: immune
    input: number
    min: 0
    max: 1000
    step: 0.01
    freshness_hours: 36
    hazards: [radiation]
    risks: [radiation_cancer, immune]
    # Illustrative: MSL RAD measured an absorbed dose of ~0.48 mGy/day in transit
    # and ~0.21 mGy/day on the Mars surface (dose equivalent ~1.8 and ~0.6 mSv/day);
    # a solar particle event can add tens of mGy.
    thresholds:
      nominal: {min: null, max: 1.0}
      caution: {min: null, max: 2.0}
    about: Absorbed dose recorded by your personal dosimeter over the last 24 hours.
    how_to_measure:
      - Read the personal dosimeter in the evening, or let it send the value automatically.
    why_in_space: Outside Earth's magnetic field, cosmic rays and solar storms add a dose that raises the lifetime cancer risk.
    guidance:
      caution:
        title: Radiation dose above background
        action: Check the module dose rate on the Vehicle display, limit time near the hull and postpone EVAs.
        recheck_minutes: 0
        escalate: false
      critical:
        title: High radiation dose
        action: Go to the storm shelter, stay until the all-clear and report the dose to the flight surgeon.
        recheck_minutes: 60
        escalate: true
  - code: vision_change
    name: Vision change
    short_name: Vision
    unit: score
    system: eyes
    input: scale
    min: 0
    max: 3
    step: 1
    freshness_hours: 192
    hazards: [gravity]
    risks: [sans]
    scale_labels:
      - {value: 0, label: None}
      - {value: 1, label: Slight}
      - {value: 2, label: Noticeable}
      - {value: 3, label: Marked}
    # Self-report scale; bands chosen for the prototype.
    thresholds:
      nominal: {min: 0, max: 0}
      caution: {min: 0, max: 1}
    about: Any change in near or far vision since last week, from 0 (none) to 3 (marked).
    how_to_measure:
      - Once a week, read the near and far vision cards at the marked distance, one eye at a time.
    why_in_space: Fluid shifts toward the head can change the shape of the eye (SANS); early changes are easy to miss.
    guidance:
      caution:
        title: Slight vision change
        action: Repeat the vision card test tomorrow and note which eye and distance.
        recheck_minutes: 0
        escalate: false
      critical:
        title: Noticeable vision change
        action: Do the full eye exam procedure and report it to the flight surgeon at the next conference.
        recheck_minutes: 0
        escalate: true

# --- Countermeasures (FR-34): what protects against each NASA HRP risk -------------
countermeasures:
  - code: resistance_exercise
    title: Resistance exercise
    how: Squats, deadlifts and heel raises on the resistance device, about 75 min a day.
    risks: [bone, fitness]
  - code: aerobic_exercise
    title: Aerobic exercise
    how: Treadmill or cycle intervals, about 45 min a day, keeping heart rate in the prescribed zone — 2 h of exercise a day together with resistance work.
    risks: [fitness, cardiovascular]
  - code: hydration
    title: Hydration and diet
    how: 2–2.5 L of water a day, enough calories and vitamin D; limit salt.
    risks: [nutrition, bone]
  - code: sleep_hygiene
    title: Sleep hygiene
    how: A fixed sleep window, dark and quiet quarters, no screens or caffeine before sleep, light exposure after waking.
    risks: [sleep, behavioral]
  - code: private_conference
    title: Private conferences and leisure
    how: Weekly private psychological conference, family messages, personal time protected in the schedule.
    risks: [behavioral, teamwork]
  - code: crew_briefings
    title: Crew briefings
    how: Daily planning conference and an open debrief after each EVA.
    risks: [teamwork]
  - code: prebreathe
    title: EVA prebreathe protocol
    how: Breathe pure oxygen before an EVA to wash out nitrogen; check for joint pain afterwards.
    risks: [decompression, eva, hypoxia]
  - code: cabin_air_checks
    title: Cabin air monitoring
    how: Keep fans on, check ppO₂ and ppCO₂ where you sleep and work; move if CO₂ stays above 3 mmHg.
    risks: [hypoxia, sans]
  - code: storm_shelter
    title: Radiation shelter and dosimetry
    how: Wear the personal dosimeter; go to the storm shelter on a solar particle event alert.
    risks: [radiation_cancer, immune]
  - code: hygiene
    title: Hygiene and surface cleaning
    how: Hand hygiene before meals, weekly surface cleaning, food safety rules.
    risks: [microbiome, immune]
  - code: vision_checks
    title: Vision checks
    how: Weekly vision card test and periodic eye exam to catch SANS early.
    risks: [sans]
  - code: balance_training
    title: Balance and readaptation
    how: Balance drills after gravity changes; move slowly for the first days after landing.
    risks: [sensorimotor, dynamic_loads, cardiovascular]

# --- Daily schedule (FR-40): what to measure and when -------------------------------
# Times are mission UTC. kind: indicators (done when every listed indicator has a
# reading in the window) or manual (the crew member marks it done).
schedule:
  - code: morning_vitals
    title: Morning vitals
    every: daily
    from_hour: 5
    due_hour: 9
    indicators: [heart_rate, spo2, bp_systolic, bp_diastolic, body_temp, glucose]
  - code: morning_checkin
    title: Morning check-in
    every: daily
    from_hour: 5
    due_hour: 10
    indicators: [sleep_hours, mood, stress, headache, exercise_minutes, water_intake]
  - code: exercise
    title: Exercise session (2 h)
    every: daily
    from_hour: 0
    due_hour: 20
    manual: true
  - code: evening_bp
    title: Evening blood pressure
    every: daily
    from_hour: 18
    due_hour: 22
    indicators: [bp_systolic, bp_diastolic]
  - code: dosimeter
    title: Read the personal dosimeter
    every: daily
    from_hour: 18
    due_hour: 23
    indicators: [radiation_dose]
  - code: weekly_mass
    title: Weekly body mass
    every: weekly
    from_hour: 5
    due_hour: 10
    indicators: [body_mass_change]
  - code: weekly_vision
    title: Weekly vision check
    every: weekly
    from_hour: 5
    due_hour: 12
    indicators: [vision_change]

# --- Vehicle environment (REQUIREMENTS §5.9) ----------------------------------------
# Life-support parameters per module. Bands are ILLUSTRATIVE, based on
# NASA-STD-3001 Vol. 2 §6.2 (atmosphere) and ISS operating practice; flight
# rules use more detailed limits. Thresholds: same rule as indicators.
vehicle_parameters:
  - code: cabin_pressure
    name: Cabin pressure
    short_name: Pressure
    unit: kPa
    system: respiratory
    min: 0
    max: 120
    step: 0.1
    freshness_minutes: 240
    # Source: NASA-STD-3001 Vol. 2 [V2 6006] — indefinite exposure at
    # 34.5 < p ≤ 103 kPa. Bands are for a sea-level-equivalent cabin (ISS 101.3 kPa).
    thresholds:
      nominal: {min: 97, max: 103}
      caution: {min: 94, max: 105}
    about: Total air pressure in the module.
    guidance:
      caution:
        title: Cabin pressure is off-nominal
        action: Check for leaks in the module and report the reading to the commander.
        recheck_minutes: 30
        escalate: false
      critical:
        title: Cabin pressure is critical
        action: Follow the rapid depressurization procedure; close the hatch and move to a safe module.
        recheck_minutes: 5
        escalate: false
  - code: ppo2
    name: Oxygen partial pressure (ppO₂)
    short_name: ppO₂
    unit: kPa
    system: respiratory
    min: 0
    max: 50
    step: 0.1
    freshness_minutes: 240
    # Source: ISS operating range, ppO₂ 19.5–23.1 kPa (2.83–3.35 psia) at sea-level
    # pressure. NASA-STD-3001 Vol. 2 [V2 6003] sets its limits as inspired O₂.
    thresholds:
      nominal: {min: 19.5, max: 23.1}
      caution: {min: 18.0, max: 25.0}
    about: How much oxygen there is to breathe. Too low causes hypoxia; too high raises the fire risk.
    guidance:
      caution:
        title: Oxygen level in the module is off-nominal
        action: Check the oxygen generator and ventilation; avoid strenuous work in this module until ppO₂ is nominal.
        recheck_minutes: 30
        escalate: false
        supplies: [oxygen_mask]
      critical:
        title: Oxygen level in the module is critical
        action: Leave the module or put on an oxygen mask; report to the commander now.
        recheck_minutes: 5
        escalate: false
        supplies: [oxygen_mask, oxygen_cylinder]
  - code: ppco2
    name: Carbon dioxide (ppCO₂)
    short_name: ppCO₂
    unit: mmHg
    system: respiratory
    min: 0
    max: 30
    step: 0.1
    freshness_minutes: 240
    # Source: NASA-STD-3001 Vol. 2 [V2 6004] — ppCO₂ ≤ 3 mmHg (one-hour average); ISS
    # experience links 3–5 mmHg to headaches. Caution band is illustrative.
    thresholds:
      nominal: {min: null, max: 3.0}
      caution: {min: null, max: 5.3}
    about: Exhaled CO₂ removed by the scrubbers. Pockets of CO₂ build up where air does not mix and cause headaches, poor sleep and slow thinking.
    guidance:
      caution:
        title: CO₂ is elevated in your module
        action: Check the CO₂ scrubber and fans in this module, improve air mixing, and sleep or work in another module until ppCO₂ is under 3 mmHg.
        recheck_minutes: 60
        escalate: false
      critical:
        title: CO₂ is critically high in your module
        action: Leave the module now, switch the scrubber to backup and report to the commander.
        recheck_minutes: 10
        escalate: false
  - code: cabin_temp
    name: Air temperature
    short_name: Temperature
    unit: °C
    system: immune
    min: -20
    max: 60
    step: 0.1
    freshness_minutes: 240
    # Source: NASA-STD-3001 Vol. 2 [V2 6012], crew health environmental limits — 18–27 °C.
    thresholds:
      nominal: {min: 18, max: 27}
      caution: {min: 16, max: 29}
    about: Air temperature in the module.
    guidance:
      caution:
        title: Module temperature is off-nominal
        action: Adjust the thermal control setpoint and dress for the temperature.
        recheck_minutes: 60
        escalate: false
      critical:
        title: Module temperature is critical
        action: Move to another module and report the thermal control fault.
        recheck_minutes: 15
        escalate: false
  - code: humidity
    name: Relative humidity
    short_name: Humidity
    unit: '%RH'
    system: immune
    min: 0
    max: 100
    step: 1
    freshness_minutes: 240
    # Source: NASA-STD-3001 Vol. 2 [V2 6012], crew health environmental limits — relative humidity 25–75 %.
    thresholds:
      nominal: {min: 25, max: 75}
      caution: {min: 20, max: 80}
    about: Moisture in the air. Too dry irritates eyes and airways; too humid lets microbes and condensation grow.
    guidance:
      caution:
        title: Humidity is off-nominal
        action: Check the condensing heat exchanger; wipe condensation and drink more water if the air is dry.
        recheck_minutes: 120
        escalate: false
      critical:
        title: Humidity is critical
        action: Report the humidity control fault; protect electronics from condensation.
        recheck_minutes: 30
        escalate: false
  - code: dose_rate
    name: Radiation dose rate
    short_name: Dose rate
    unit: µGy/h
    system: immune
    min: 0
    max: 100000
    step: 0.1
    freshness_minutes: 240
    # Illustrative: MSL RAD measured ~9 µGy/h on the Mars surface and ~20 µGy/h
    # in transit; solar particle events raise it by orders of magnitude.
    thresholds:
      nominal: {min: null, max: 30}
      caution: {min: null, max: 100}
    about: Radiation measured by the module dosimeter. Galactic cosmic rays give a steady dose; solar particle events cause sudden spikes.
    guidance:
      caution:
        title: Radiation is above background
        action: Limit time in this module and postpone EVAs until the dose rate is back to background.
        recheck_minutes: 30
        escalate: false
      critical:
        title: Possible solar particle event
        action: Go to the storm shelter now and stay there until the commander gives the all-clear.
        recheck_minutes: 10
        escalate: false

# --- Rule texts used by internal/guidance ------------------------------------------
rules:
  - id: repeated_critical
    title: Repeated critical reading
    action: Two critical readings in a row — report to the flight surgeon and follow the protocol.
    recheck_minutes: 5
    escalate_reason: Two consecutive critical readings of the same indicator.
  - id: sleep_debt
    title: Accumulating sleep debt
    action: Shift non-critical tasks, protect the next sleep period, darken the crew quarters and avoid caffeine after midday.
    recheck_minutes: 0
    escalate_reason: Three or more nights in a row with less than 5 hours of sleep.
    supplies: [sleep_kit]
  - id: post_eva_hypoxia
    title: Low blood oxygen after a spacewalk
    action: Rest on cabin air, check for decompression symptoms (joint pain, tingling, headache) and re-measure SpO₂ every 15 minutes.
    recheck_minutes: 15
    escalate_reason: Blood oxygen was below normal after a spacewalk (hypoxia / decompression risk).
    supplies: [oxygen_mask, oxygen_cylinder, pulse_oximeter]
  - id: low_mood_streak
    title: Low mood or high stress for several days
    action: Talk to the commander about workload, keep a regular schedule and schedule a private conference with the psychologist.
    recheck_minutes: 0
    escalate_reason: Low mood or high stress for two days in a row.
  - id: trend
    title: Trending toward the limit
    action: Nothing is out of range yet. Review what changed — diet, exercise, sleep or workload — and keep measuring on schedule; raise it at the next medical conference.
    recheck_minutes: 0
    escalate_reason: A steady trend will leave the nominal range soon.
